name: Go CI

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check, defaults to the triggering commit
        type: string
        default: ""
      vulncheck:
        description: Run govulncheck, only turn this off with a linked reason
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    # RUNNER is a repo or org variable, fork PRs always stay on hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - id: setup
        uses: MizuchiLabs/.github/actions/setup@main

      - name: Frontend
        if: steps.setup.outputs.web == 'true'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run --if-present check
          pnpm run --if-present lint
          pnpm build

      - name: Modules
        run: |
          go mod tidy -diff
          go mod verify

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          skip-cache: ${{ runner.environment != 'github-hosted' }}

      - name: Test
        run: go test -race -shuffle=on ./...

      # Not govulncheck-action, its own setup-go uploads the self-hosted runner's whole Go cache.
      - name: Vulncheck
        if: inputs.vulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: GoReleaser config
        if: hashFiles('.goreleaser.yaml') != ''
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: check

  # Inlined instead of calling actionlint.yaml, release would hit the nesting limit.
  workflows:
    name: Workflows
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The actionlint action installs with npm, self-hosted runners don't ship it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
