name: Go Release

on:
  workflow_call:
    inputs:
      vulncheck:
        description: Run govulncheck, only turn this off with a linked reason
        type: boolean
        default: true
    secrets:
      LICENSE_PUBLIC_KEY:
        description: kata/licx public key, goreleaser reads it as .Env.LICENSE_PUBLIC_KEY
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      tagged: ${{ steps.plan.outputs.tagged }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: git-cliff

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # Commits that only touch these don't change what ships, so they never bump the version.
          GIT_CLIFF_EXCLUDE_PATH: >-
            **/*.md docs/** .github/** **/*_test.go **/testdata/** LICENSE* .gitignore .editorconfig
            .golangci.yml cliff.toml taskfile.yaml compose.y*ml .env.example
        run: |
          if grep -q '^kos:' .goreleaser.yaml 2>/dev/null; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          fi

          # Schedules and pushes to main release on their own, tags and manual runs on demand.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            releases="$(gh release list --limit 1 --json tagName --jq length)"
            if [ "$releases" = 0 ]; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "No release yet, the first one is cut by hand with a tag or a manual run." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # Pushes to main only release early for security fixes, everything else waits for the schedule.
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
              subjects="$(git log --format=%s "${last:+$last..}HEAD")"
              if ! grep -qE '^sec(\(.*\))?!?:' <<<"$subjects"; then
                echo "release=false" >> "$GITHUB_OUTPUT"
                echo "No security fix since ${last:-the start}, waiting for the scheduled release." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git-cliff --bumped-version)"
          fi

          # An existing tag without a release means a previous run failed after tagging, so retry it.
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            if gh release view "$version" >/dev/null 2>&1; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Nothing to release, $version is the latest release." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            tagged=true
            sha="$(git rev-list -n 1 "$version")"
          else
            tagged=false
            sha="$GITHUB_SHA"
          fi

          {
            echo "release=true"
            echo "version=$version"
            echo "sha=$sha"
            echo "tagged=$tagged"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $sha." >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: MizuchiLabs/.github/.github/workflows/go-ci.yaml@main
    with:
      ref: ${{ needs.plan.outputs.sha }}
      vulncheck: ${{ inputs.vulncheck }}

  release:
    name: Release
    needs: [plan, ci]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    # Shared with go-nightly so a cleanup never runs while another push is half done.
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true # the Tag step pushes

      # No cache, anything running on main could write a poisoned one that ends up in the release.
      - uses: MizuchiLabs/.github/actions/setup@main
        with:
          cache: false

      # Self-hosted runners share their Go caches with every branch's CI, so builds that ship start empty.
      - name: Fresh Go caches
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/go-build"
            echo "GOMODCACHE=$RUNNER_TEMP/go-mod"
            echo "GOFLAGS=-modcacherw" # read-only module files would block the runner's temp cleanup
          } >> "$GITHUB_ENV"

      - name: Detect tools
        id: tools
        run: |
          if [ -f .goreleaser.yaml ]; then
            echo "goreleaser=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tools.outputs.goreleaser == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - if: steps.tools.outputs.goreleaser == 'true'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - if: needs.plan.outputs.images == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags pushed with the workflow token do not trigger other workflows, so the release happens right here.
      - name: Tag
        if: needs.plan.outputs.tagged != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION" "$SHA"
          git push origin "$VERSION"

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: git-cliff

      - name: Release notes
        run: git-cliff --latest --strip header -o "$RUNNER_TEMP/notes.md"

      - name: GoReleaser
        if: steps.tools.outputs.goreleaser == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COSIGN_YES: "true"
          LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
          # A repo can hold other tags on the same commit, like the license/v* of a nested module.
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}

      - name: GitHub release
        if: steps.tools.outputs.goreleaser != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      # Version tags are kept forever, users pin them. Only leftovers go.
      - if: needs.plan.outputs.images == 'true'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          token: ${{ github.token }}
