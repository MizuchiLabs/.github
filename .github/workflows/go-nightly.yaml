name: Go Nightly

on:
  workflow_call:
    secrets:
      BUILD_ENV:
        description: NAME=value lines the build sees as env, read in .goreleaser.yaml as .Env.NAME. Only for values that may end up in the binary, like a license public key
        required: false

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    # Shared with the release job so a cleanup never runs while another push is half done.
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the same image a release would, from the first kos entry in .goreleaser.yaml and the build it uses.
      - name: Ko config
        id: ko
        run: |
          if ! grep -q '^kos:' .goreleaser.yaml 2>/dev/null; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No kos in .goreleaser.yaml, nothing to build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Same fallbacks as goreleaser, the kos entry first, then the build it names.
          # shellcheck disable=SC2016
          yq '
            .project_name as $name
            | .kos[0] as $ko
            | ((.builds // []) | map(select((.id // $name) == ($ko.build // $ko.id // $name))) | .[0] // {}) as $b
            | {
                "defaultBaseImage": ($ko.base_image // "cgr.dev/chainguard/static"),
                "builds": [{
                  "id": "app",
                  "main": ($ko.main // $b.main // "."),
                  "env": ($ko.env // $b.env // []),
                  "flags": ($ko.flags // $b.flags // []),
                  "ldflags": ($ko.ldflags // $b.ldflags // [])
                }]
              }
          ' .goreleaser.yaml > .ko.yaml
          # goreleaser and ko name their template fields differently.
          sed -i -E \
            -e 's/\{\{ *\.Version *\}\}/nightly/g' \
            -e 's/\{\{ *\.(Full)?Commit *\}\}/{{ .Git.FullCommit }}/g' \
            -e 's/\{\{ *\.(ShortCommit|CommitDate|CommitTimestamp) *\}\}/{{ .Git.\1 }}/g' \
            .ko.yaml
          {
            echo "enabled=true"
            echo "main=$(yq '.builds[0].main' .ko.yaml)"
            echo "repo=$(yq '.kos[0].repositories[0]' .goreleaser.yaml)"
            echo "platforms=$(yq '.kos[0].platforms // ["linux/amd64"] | join(",")' .goreleaser.yaml)"
            echo "sbom=$(yq '.kos[0].sbom // "spdx"' .goreleaser.yaml)"
          } >> "$GITHUB_OUTPUT"

      # No cache, anything running on main could write a poisoned one that ends up in the image.
      - id: setup
        if: steps.ko.outputs.enabled == 'true'
        uses: MizuchiLabs/.github/actions/setup@main
        with:
          cache: false

      # Self-hosted runners share their Go caches with every branch's CI, so builds that ship start empty.
      - name: Fresh Go caches
        if: steps.ko.outputs.enabled == 'true'
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/go-build"
            echo "GOMODCACHE=$RUNNER_TEMP/go-mod"
            echo "GOFLAGS=-modcacherw" # read-only module files would block the runner's temp cleanup
          } >> "$GITHUB_ENV"

      - name: Frontend
        if: steps.ko.outputs.enabled == 'true' && steps.setup.outputs.web == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - if: steps.ko.outputs.enabled == 'true'
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - if: steps.ko.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build env
        if: steps.ko.outputs.enabled == 'true'
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        # The runner masks the whole secret, not each value, and later steps print their env.
        run: |
          printf '%s\n' "$BUILD_ENV" | sed '/^[[:space:]]*$/d' | while IFS= read -r line; do
            if [ -n "${line#*=}" ]; then echo "::add-mask::${line#*=}"; fi
            echo "$line" >> "$GITHUB_ENV"
          done

      - name: Build and push
        if: steps.ko.outputs.enabled == 'true'
        env:
          MAIN: ${{ steps.ko.outputs.main }}
          PLATFORMS: ${{ steps.ko.outputs.platforms }}
          SBOM: ${{ steps.ko.outputs.sbom }}
          KO_DOCKER_REPO: ${{ steps.ko.outputs.repo }}
        run: |
          # ko prints only the multi-arch index ref on stdout, that is what gets signed.
          ref="$(ko build "$MAIN" --bare --tags nightly --platform "$PLATFORMS" --sbom "$SBOM")"
          cosign sign --yes "$ref"
          echo "Pushed $KO_DOCKER_REPO:nightly" >> "$GITHUB_STEP_SUMMARY"

      # The previous nightly is untagged now, this removes it along with its signature and SBOM.
      - if: steps.ko.outputs.enabled == 'true'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          token: ${{ github.token }}
